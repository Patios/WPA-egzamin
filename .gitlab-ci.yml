image: node:22

pages:
  stage: deploy
  script:
    - npm ci
    - |
      BASE_PATH="$(node -e "const path=new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/, ''); process.stdout.write(path === '/' ? '' : path)")"
      echo "BASE_PATH=$BASE_PATH"
      BASE_PATH="$BASE_PATH" npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
